[workspace]
resolver = "3"
# Bottom-up: the CLI depends on transport, never the reverse.
members = ["crates/remoteusb-transport", "crates/remoteusb-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
rust-version = "1.99"

# Each dependency supplies functionality absent from std.
[workspace.dependencies]
remoteusb-transport = { path = "crates/remoteusb-transport" }
# Asynchronous sockets, bounded connection tasks, and shutdown signals.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Local Groupnet cutover at 82b8595; see README for the sibling checkout layout.
groupnet = { path = "../../napbat/groupnet/crates/groupnet", default-features = false, features = ["runtime", "tcp-msg", "connectivity"] }
# Bridge Groupnet futures-IO streams into the bounded Tokio TCP copy path.
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", features = ["io"] }
# PEM credential parsing and explicit Rustls certificate/key types.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
# CLI parsing, validation, and generated usage.
clap = { version = "4", features = ["derive"] }
# Local credential issuance, secure fabric keys, and isolated test fixtures.
rcgen = "0.14"
getrandom = "0.4"
tempfile = "3"

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[profile.release]
panic = "abort"
